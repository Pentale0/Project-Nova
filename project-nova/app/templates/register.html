{% extends "base.html" %}
{% block title %}Register — PROJECT NOVA{% endblock %}
{% block content %}
<div class="nova-card" style="max-width: 420px; margin: 40px auto;">
  <h2>Create Your Run</h2>
  {% if error %}<div class="nova-error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <div class="nova-field">
      <label for="handle">Handle</label>
      <input type="text" id="handle" name="handle" placeholder="e.g. anasb" required pattern="[a-zA-Z0-9_-]+">
      <span class="nova-hint">URL-safe: letters, numbers, - or _. Becomes /u/your-handle.</span>
    </div>
    <div class="nova-field">
      <label for="display_name">Display Name</label>
      <input type="text" id="display_name" name="display_name" placeholder="e.g. Anas" required>
    </div>
    <div class="nova-field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" required minlength="6">
    </div>
    <button type="submit" class="nova-btn">Begin</button>
  </form>
  <p class="nova-hint" style="margin-top:16px;">Already have a run? <a href="/login">Login</a></p>
</div>
{% endblock %}
